name: Robots Monitor Venezuela
on:
  # El reloj principal ahora es Supabase (supabase/programador_robots.sql): llama a esta misma acción cada
  # 20 minutos con workflow_dispatch, porque GitHub pierde o atrasa por horas sus corridas programadas.
  # Estas programaciones de GitHub quedan solo como respaldo.
  schedule:
    - cron: "17 * * * *"
    - cron: "5 13-23/2 * * 1-5"
    - cron: "40 23 * * *"
    - cron: "15 10 * * 0"
    # Telegram: buenos días (8:47 y 8:53 am VET) y cierre (4:22 y 4:28 pm VET, lunes a viernes).
    # Van a minutos "raros" y unos minutos antes porque GitHub atrasa más las corridas en punto.
    - cron: "47,53 12 * * *"
    - cron: "22,28 20 * * 1-5"
  push:
    branches: [main]
    paths: ["data/**", "config/**", "ingest/catalog.py"]
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué correr"
        type: choice
        options: [backfill, frequent, oficial, daily, weekly, files, telegram, acciones]
        default: backfill
permissions:
  contents: write   # para guardar en el repositorio los documentos que descargan los robots
concurrency:
  # misma tarea = misma fila: si llegan dos órdenes iguales (Supabase y el respaldo de GitHub), la segunda espera
  group: robots-${{ inputs.tarea || (github.event.schedule == '40 23 * * *' && 'daily') || (github.event.schedule == '5 13-23/2 * * 1-5' && 'oficial') || (github.event.schedule == '15 10 * * 0' && 'weekly') || ((github.event.schedule == '47,53 12 * * *' || github.event.schedule == '22,28 20 * * 1-5') && 'telegram') || (github.event_name == 'push' && 'files') || 'frequent' }}
  # una corrida nunca corta a la anterior: la nueva espera a que termine (cada robot tiene su propio tiempo máximo)
  cancel-in-progress: false
jobs:
  robots:
    runs-on: ubuntu-latest
    # corridas frecuentes, oficiales y de Telegram: máximo 35 min; diaria, semanal, archivos y manuales largas: hasta 5 h
    timeout-minutes: ${{ (github.event_name == 'push' || github.event.schedule == '40 23 * * *' || github.event.schedule == '15 10 * * 0' || contains(fromJSON('["daily","weekly","backfill","files","acciones"]'), inputs.tarea)) && 300 || 35 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - name: OCR y fuentes (informes de SUNAVAL y PDF por acción)
        if: ${{ !contains(github.event.schedule, ' 12 * * *') && !contains(github.event.schedule, ' 20 * * 1-5') && inputs.tarea != 'telegram' && inputs.tarea != 'frequent' }}
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr fonts-lato libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r ingest/requirements.txt
      - name: Elegir tarea
        id: t
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "push:"*)               echo "g=files" >> $GITHUB_OUTPUT ;;
            "workflow_dispatch:"*)  echo "g=${{ inputs.tarea }}" >> $GITHUB_OUTPUT ;;
            "schedule:40 23 * * *") echo "g=daily" >> $GITHUB_OUTPUT ;;
            "schedule:5 13-23/2 * * 1-5") echo "g=oficial" >> $GITHUB_OUTPUT ;;
            "schedule:15 10 * * 0") echo "g=weekly" >> $GITHUB_OUTPUT ;;
            "schedule:47,53 12 * * *"|"schedule:22,28 20 * * 1-5") echo "g=telegram" >> $GITHUB_OUTPUT ;;
            *)                      echo "g=frequent" >> $GITHUB_OUTPUT ;;
          esac
      - name: Ejecutar robots
        run: python -m ingest.run ${{ steps.t.outputs.g }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Guardar en el repositorio los documentos descargados
        if: always()
        continue-on-error: true
        run: |
          git config user.name "robots-monitor"
          git config user.email "robots-monitor@users.noreply.github.com"
          git add data/archivo 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Robots: documentos descargados ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
